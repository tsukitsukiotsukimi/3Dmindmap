<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D MindMap</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1a1a2e; }
      #root { height: 100%; }
      #app-loader {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 12px;
        background: #1a1a2e; color: #a0a0b0; font-family: sans-serif; font-size: 14px;
        z-index: 9999;
      }
      #app-loader .spinner {
        width: 32px; height: 32px; border: 3px solid #2a2a4a;
        border-top-color: #4a90d9; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="spinner"></div>
        <div>Loading 3D MindMap...</div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('app-loader');
        if (loader) {
          loader.innerHTML = '<div style="color:#e74c3c;font-size:16px">読み込みエラー</div>' +
            '<div style="font-size:12px;max-width:400px;text-align:center">' + (e.message || 'Unknown error') + '</div>' +
            '<button onclick="location.reload()" style="padding:8px 16px;background:#4a90d9;color:#fff;border:none;border-radius:4px;cursor:pointer">再読み込み</button>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
